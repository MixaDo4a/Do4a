<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Холодный латте — bubble up</title><style>*{box-sizing:border-box}body{margin:0;background:#101524;color:#fff;font:16px Arial,sans-serif}.screen{max-width:620px;min-height:100vh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(150deg,#432619 0%,#d99a7c 45%,#435dd4 100%);padding:24px 20px 34px}.screen:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#f7dac080 0 12%,transparent 36%),linear-gradient(180deg,#20170c20 0%,transparent 50%,#1c3ba880 100%);pointer-events:none}.content{position:relative;z-index:1;min-height:calc(100vh - 58px);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.circle{width:48px;height:48px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff1a;color:white;font-size:26px}.title{text-align:center;font-size:23px;line-height:1.08;max-width:330px}.dots{letter-spacing:4px}.nutrition{display:flex;justify-content:center;gap:24px;margin:20px 0 8px;text-align:center}.nutrition b{display:block;font-size:19px}.nutrition span{display:block;color:#ffffffaa;font-size:13px;margin-top:4px}.more{align-self:center;border:0;border-radius:999px;background:#5f4538cc;color:#fff;padding:11px 20px;font-size:15px}.visual{flex:1;min-height:350px;display:grid;place-items:center;position:relative}.visual:before{content:'🥤';font-size:170px;filter:drop-shadow(0 22px 20px #10162b77)}.pour{position:absolute;top:100px;width:4px;height:150px;background:#5b1515;border-radius:6px}.addons{display:flex;gap:10px;overflow:auto;padding:12px 0 18px}.addon{flex:0 0 122px;min-height:150px;border:0;border-radius:24px;background:#5f79d855;color:#fff;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:15px;text-align:center}.addon .add{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#6f8ae8;color:white;font-size:25px}.addon.selected{outline:2px solid #fff;background:#7289e688}.bottom{display:flex;gap:14px;align-items:center;padding-top:8px}.volume{flex:0 0 125px;border:0;border-radius:999px;background:#6a7fa855;color:#fff;padding:19px 12px;font-size:19px}.addcart{flex:1;border:0;border-radius:999px;background:#3452ed;color:#fff;padding:19px 15px;font-size:22px}.note{text-align:center;color:#ffffffaa;font-size:12px;margin-top:12px}@media(max-width:420px){.title{font-size:20px}.nutrition{gap:14px}.visual{min-height:310px}.visual:before{font-size:145px}}
</style></head><body><main class="screen"><div class="content"><div class="top"><button class="circle" onclick="history.back()">‹</button><div class="title">Холодный латте двойной<br>протеин ваниль</div><button class="circle dots">···</button></div><div class="nutrition"><div><b>213 ккал</b><span>энергия</span></div><div><b>27,2 г</b><span>белки</span></div><div><b>5,6 г</b><span>жиры</span></div><div><b>12,0 г</b><span>углеводы</span></div></div><button class="more">подробнее⌄</button><div class="visual"><div class="pour"></div></div><div class="addons"><button class="addon selected" data-price="0"><span>🥛</span><span>Протеиновое<br>молоко</span></button><button class="addon" data-price="0"><span>☕</span><span>Холодный<br>эспрессо</span></button><button class="addon" data-price="0"><span>🧊</span><span>Со льдом</span></button><button class="addon" data-price="45"><span class="add">+</span><span>Цветы и<br>шарики</span></button><button class="addon" data-price="50"><span class="add">+</span><span>Сиропы</span></button><button class="addon" data-price="70"><span class="add">+</span><span>Топпинги</span></button></div><div class="bottom"><button class="volume">400 мл</button><button class="addcart" id="add">+ 515 ₽</button></div><div class="note">Заглушка вместо видео · интерактивный выбор допов</div></div></main><script>let price=515;document.querySelectorAll('.addon').forEach((a)=>a.onclick=()=>{const was=a.classList.contains('selected');a.classList.toggle('selected');price+=was?-Number(a.dataset.price):Number(a.dataset.price);document.getElementById('add').textContent='+ '+price+' ₽'});document.getElementById('add').onclick=()=>{document.getElementById('add').textContent='Добавлено ✓';document.getElementById('add').style.background='#48a66b'}</script></body></html>
